; TSP05 integrated firmware: one program on one ESP32 for all sensors and motors.
;
;   pio run -e esp32dev -t upload     real hardware (VL53L5CX connected)
;   pio run -e wokwi                  build for the Wokwi simulator (ToF faked by a slide pot)
;   pio device monitor                serial monitor, 115200 baud

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    madhephaestus/ESP32Servo

[env:esp32dev]
lib_deps =
    ${env.lib_deps}
    sparkfun/SparkFun VL53L5CX Arduino Library

[env:wokwi]
; SIM_TOF:    no VL53L5CX in Wokwi, so a slide pot on GPIO35 stands in for the hand.
; MICROSTEP=1: Wokwi's stepper only fully supports full steps (A4988 MS pins left low).
; FLEX_*_MV:  the knob sweeps 0-3.3 V, so use the full range instead of the real calibration.
build_flags =
    -DSIM_TOF
    -DMICROSTEP=1
    -DFLEX_STRAIGHT_MV=0
    -DFLEX_BENT_MV=3300
