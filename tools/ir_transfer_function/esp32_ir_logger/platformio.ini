; Sharp IR raw-output logger for the transfer-function plot (standalone, not the team main firmware).
;
;   pio run -t upload        build and flash
;   pio device monitor       check the stream (close it before running ir_transfer.py)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
